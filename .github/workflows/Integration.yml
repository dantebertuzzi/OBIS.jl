name: Integration

# These tests reach the live OBIS API to detect changes the recorded fixtures would hide.
# They run weekly and on request, never on every push, so the package does not generate
# unnecessary load on a service that publishes no request quota.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    name: Live API check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run integration tests
        run: julia --project=. test/integration/runtests.jl
